# Hyper-simple CI: one job, one runner, no matrix — the whole quality gate
# in a few minutes of (free for public repos) compute. The same checks run
# locally with ./scripts/check.sh at zero cost.
name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch: # manual: also runs the benchmark comparison job

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Build, vet, test (root module)
        run: |
          go build ./...
          go vet ./...
          go test ./...

      - name: Race detector (core)
        run: go test -race ./pkg/...

      - name: Build, vet, test (examples/http_dsl module)
        working-directory: examples/http_dsl
        run: |
          go build ./...
          go vet ./...
          go test ./...

  # Manual benchmark regression check: compares HEAD against main on the
  # SAME runner (numbers from different machines are meaningless, so the
  # committed baseline is not used here). Run it from the Actions tab.
  bench:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Install benchstat
        run: go install golang.org/x/perf/cmd/benchstat@latest

      - name: Benchmark main (baseline)
        run: |
          git checkout origin/main
          go test -run xxx -bench . -benchmem -count 6 ./pkg/dslbuilder | tee /tmp/bench_main.txt

      - name: Benchmark HEAD
        run: |
          git checkout ${{ github.sha }}
          go test -run xxx -bench . -benchmem -count 6 ./pkg/dslbuilder | tee /tmp/bench_head.txt

      - name: Compare
        run: benchstat /tmp/bench_main.txt /tmp/bench_head.txt
